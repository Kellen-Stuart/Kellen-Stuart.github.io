#:schema https://developers.openai.com/codex/config-schema.json

# Project-local Codex config.
#
# Purpose:
# - Let Codex freely read, edit, test, format, and inspect files in this repository.
# - Keep OS-level changes, dependency installs, network access, and secret access gated by approval.
# - Avoid duplicating global ~/.codex/config.toml settings.

approval_policy = "on-request"
approvals_reviewer = "user"

sandbox_mode = "workspace-write"
allow_login_shell = false
web_search = "cached"

developer_instructions = """
This repository is trusted for normal development work.

Codex may read, create, modify, move, and delete files inside this repository when doing ordinary project work, including implementation, refactors, tests, formatting, linting, documentation edits, and git inspection.

Codex must ask before:
- intentionally writing outside this repository
- changing operating system state
- installing, upgrading, or removing system packages
- installing, upgrading, or removing project dependencies
- using network access for dependency resolution, package metadata, documentation lookup, downloads, or external API calls
- running commands that start services, daemons, containers, VMs, or background processes
- changing shell, SSH, Git global, package-manager global, cloud CLI, or credential-manager configuration
- reading, printing, summarizing, copying, modifying, or exfiltrating likely secret material

Likely secret material includes:
- .env
- .env.*
- *.env
- secrets/
- secret/
- .secrets/
- .secret/
- credentials/
- .credentials/
- credentials.json
- service-account.json
- service-account-key.json
- *.pem
- *.key
- *.p12
- *.pfx
- id_rsa
- id_ed25519
- .npmrc
- .netrc
- .git-credentials

Prefer safe project-local commands:
- git status
- git diff
- git diff --stat
- git log
- grep/rg searches that exclude likely secret paths
- package-manager scripts already defined by the repository
- test, lint, typecheck, build, and format commands that do not require network access

If a command may print secrets, redact the output or ask first.
"""
